<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretty on Repeat - Admin Dashboard</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <style>
    :root {
      --blush-pink: #F4A6B7;
      --soft-rose: #E9829B;
      --pale-pink: #FCE8E8;
      --champagne-gold: #DDB06A;
      --warm-white: #FEFEFE;
      --soft-black: #17191A;
      --func-blue: #5B8DB8;
      --func-green: #6F9B78;

      --bg-main: var(--warm-white);
      --bg-card: #FFFFFF;
      --bg-section: var(--pale-pink);
      --text-main: var(--soft-black);
      --border-color: #F1D4DC;
    }

    [data-theme="dark"] {
      --bg-main: #121314;
      --bg-card: #1D1F21;
      --bg-section: #272A2D;
      --text-main: var(--warm-white);
      --border-color: #383B3E;
    }

    * { box-sizing: border-box; font-family: 'Playfair Display', Georgia, system-ui, sans-serif; transition: background 0.3s; }
    body { margin: 0; padding: 25px; background: var(--bg-main); color: var(--text-main); max-width: 1100px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    h1 { color: var(--soft-rose); margin: 0; }

    .theme-toggle-btn {
      background: var(--bg-card); color: var(--text-main);
      border: 1px solid var(--border-color); padding: 8px 16px;
      border-radius: 20px; cursor: pointer;
    }

    .admin-card {
      background: var(--bg-section);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
    input[type="text"], input[type="number"], input[type="file"], select { 
      width: 100%; padding: 9px; background: var(--bg-card); 
      color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; 
    }

    button.btn-primary {
      background: var(--soft-rose); color: #FFF; border: none;
      padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    th { background: var(--bg-section); color: var(--text-main); }
    
    .status-confirmed { color: var(--func-green); font-weight: bold; }
    .status-cancelled { color: var(--soft-rose); font-weight: bold; }

    button.cancel-btn { background: var(--soft-rose); color: #FFF; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Pretty on Repeat — Admin</h1>
    <button class="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
  </header>

  <!-- Section 1: Create Brand New Dress Entry -->
  <div class="admin-card">
    <h3 style="margin-top:0; color: var(--champagne-gold);">Add Brand New Dress Entry</h3>
    <form id="newDressForm">
      <div class="form-group">
        <label>Dress Name:</label>
        <input type="text" id="newDressName" placeholder="e.g. Royal Blue Silk Satin Gown" required>
      </div>
      <div class="form-group">
        <label>Brand Name:</label>
        <input type="text" id="newDressBrand" placeholder="e.g. House of CB">
      </div>
      <div class="form-group">
        <label>Retail Price ($):</label>
        <input type="number" id="newDressPrice" placeholder="450" required>
      </div>
      <div class="form-group">
        <label>Cover Picture File:</label>
        <input type="file" id="newDressFile" accept="image/*" required>
      </div>
      <button type="submit" class="btn-primary" style="background: var(--func-green);">Create Catalog Card</button>
    </form>
    <p id="newDressStatus" style="font-weight: bold; margin-top: 10px;"></p>
  </div>

  <!-- Section 2: Append Uploaded Image to Existing Dress -->
  <div class="admin-card">
    <h3 style="margin-top:0; color: var(--champagne-gold);">Append Picture to Existing Dress</h3>
    <form id="uploadForm">
      <div class="form-group">
        <label>Select Dress:</label>
        <select id="dressSelect" required></select>
      </div>
      <div class="form-group">
        <label>Choose Image File:</label>
        <input type="file" id="imageFileInput" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="is360Checkbox"> 
          Is this a 360° rotation view frame?
        </label>
      </div>
      <button type="submit" class="btn-primary">Upload Picture</button>
    </form>
    <p id="uploadStatus" style="font-weight: bold; margin-top: 10px;"></p>
  </div>

  <!-- Section 3: Manage & Delete Photos or Dress Cards -->
  <div class="admin-card">
    <h3 style="margin-top:0; color: var(--champagne-gold);">Manage & Delete Catalog Photos</h3>
    <div class="form-group">
      <label>Select Dress to View Photos:</label>
      <select id="manageDressSelect" onchange="renderDressGallery()"></select>
    </div>
    
    <div id="photoGalleryGrid" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px;"></div>
    <button onclick="deleteSelectedDress()" class="cancel-btn" style="margin-top: 15px; padding: 10px 15px; font-weight: bold;">Delete Entire Dress Card</button>
  </div>

  <!-- Section 4: Active Bookings Overview -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
    <h2>Active Bookings</h2>
    <button class="btn-primary" style="background: var(--func-blue);" onclick="fetchBookings()">Refresh Table</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Booking ID</th>
        <th>Dress Name</th>
        <th>SKU / Size</th>
        <th>Rental Period</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody">
      <tr><td colspan="6">Loading bookings...</td></tr>
    </tbody>
  </table>

  <script>
    let catalogStore = [];

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.querySelector('.theme-toggle-btn');
      if (html.getAttribute('data-theme') === 'light') {
        html.setAttribute('data-theme', 'dark');
        btn.innerText = '☀️ Light Mode';
      } else {
        html.setAttribute('data-theme', 'light');
        btn.innerText = '🌙 Dark Mode';
      }
    }

    async function loadDressDropdown() {
      try {
        const res = await fetch('/api/catalog?t=' + Date.now());
        catalogStore = await res.json();
        
        const select = document.getElementById('dressSelect');
        const manageSelect = document.getElementById('manageDressSelect');
        
        const options = catalogStore.map(d => 
          `<option value="${d.id}">${d.name} (${d.brand || 'Pretty on Repeat'})</option>`
        ).join('');

        if (select) select.innerHTML = options;
        if (manageSelect) {
          manageSelect.innerHTML = options;
          renderDressGallery();
        }
      } catch (err) {
        console.error('Error loading dropdown data');
      }
    }

    function renderDressGallery() {
      const dressId = document.getElementById('manageDressSelect').value;
      const gallery = document.getElementById('photoGalleryGrid');
      const dress = catalogStore.find(d => d.id === dressId);

      if (!dress) {
        gallery.innerHTML = '<p>No dress selected.</p>';
        return;
      }

      const standardImages = (dress.image_urls || []).map(url => `
        <div style="position: relative; display: inline-block;">
          <img src="${url}" style="width: 80px; height: 110px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color);">
          <button onclick="removePhoto('${dress.id}', '${url}', false)" 
                  style="position: absolute; top: 4px; right: 4px; background: rgba(233, 130, 155, 0.9); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; font-weight: bold;">&times;</button>
        </div>
      `).join('');

      const frames360 = (dress.images_360 || []).map(url => `
        <div style="position: relative; display: inline-block;">
          <img src="${url}" style="width: 80px; height: 110px; object-fit: cover; border-radius: 6px; border: 2px solid var(--champagne-gold);">
          <span style="position: absolute; bottom: 4px; left: 4px; background: var(--champagne-gold); color: white; font-size: 9px; padding: 2px 4px; border-radius: 3px;">360°</span>
          <button onclick="removePhoto('${dress.id}', '${url}', true)" 
                  style="position: absolute; top: 4px; right: 4px; background: rgba(233, 130, 155, 0.9); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; font-weight: bold;">&times;</button>
        </div>
      `).join('');

      gallery.innerHTML = standardImages + frames360 || '<p>No images found for this dress.</p>';
    }

    // Handler: Create Brand New Dress Entry
    document.getElementById('newDressForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('newDressName').value;
      const brand = document.getElementById('newDressBrand').value;
      const price = document.getElementById('newDressPrice').value;
      const fileInput = document.getElementById('newDressFile');
      const status = document.getElementById('newDressStatus');

      const formData = new FormData();
      formData.append('name', name);
      formData.append('brand', brand);
      formData.append('retailPrice', price);
      formData.append('dressImage', fileInput.files[0]);

      status.style.color = 'var(--func-blue)';
      status.innerText = 'Creating dress entry...';

      try {
        const response = await fetch('/api/admin/create-dress', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          status.style.color = 'var(--func-green)';
          status.innerText = 'New dress created! Refreshing storefront...';
          document.getElementById('newDressForm').reset();
          loadDressDropdown();
        } else {
          status.style.color = 'var(--soft-rose)';
          status.innerText = result.message || 'Creation failed.';
        }
      } catch (err) {
        status.style.color = 'var(--soft-rose)';
        status.innerText = 'Server error during creation.';
      }
    });

    // Handler: Append Picture to Existing Dress
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const dressId = document.getElementById('dressSelect').value;
      const fileInput = document.getElementById('imageFileInput');
      const is360 = document.getElementById('is360Checkbox').checked;
      const status = document.getElementById('uploadStatus');

      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('dressImage', fileInput.files[0]);
      formData.append('dressId', dressId);
      formData.append('is360', is360);

      status.style.color = 'var(--func-blue)';
      status.innerText = 'Uploading...';

      try {
        const response = await fetch('/api/admin/upload-image', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          status.style.color = 'var(--func-green)';
          status.innerText = 'Picture uploaded and appended to dress thumbnails!';
          fileInput.value = '';
          loadDressDropdown();
        } else {
          status.style.color = 'var(--soft-rose)';
          status.innerText = result.message || 'Upload failed.';
        }
      } catch (err) {
        status.style.color = 'var(--soft-rose)';
        status.innerText = 'Server error uploading file.';
      }
    });

    async function removePhoto(dressId, imageUrl, is360) {
      if (!confirm('Remove this picture from the catalog?')) return;

      try {
        const res = await fetch('/api/admin/delete-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dressId, imageUrl, is360: is360.toString() })
        });

        const data = await res.json();
        if (data.success) {
          await loadDressDropdown();
        } else {
          alert('Failed to remove image.');
        }
      } catch (err) {
        alert('Server error.');
      }
    }

    async function deleteSelectedDress() {
      const dressId = document.getElementById('manageDressSelect').value;
      if (!confirm('Are you sure you want to delete this entire dress card from PostgreSQL?')) return;

      try {
        const res = await fetch(`/api/admin/dresses/${dressId}`, { method: 'DELETE' });
        const data = await res.json();

        if (data.success) {
          alert('Dress deleted.');
          await loadDressDropdown();
        } else {
          alert('Failed to delete dress.');
        }
      } catch (err) {
        alert('Server error deleting dress.');
      }
    }

    async function fetchBookings() {
      const tbody = document.getElementById('bookingTableBody');
      try {
        const response = await fetch('/api/admin/bookings');
        const bookings = await response.json();

        if (bookings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">No bookings found.</td></tr>';
          return;
        }

        tbody.innerHTML = bookings.map(b => `
          <tr>
            <td><small>${b.id}</small></td>
            <td><strong>${b.dress_name}</strong></td>
            <td>${b.sku} (${b.size})</td>
            <td>${b.rental_period}</td>
            <td class="status-${b.status.toLowerCase()}">${b.status}</td>
            <td>
              ${b.status !== 'CANCELLED' 
                ? `<button class="cancel-btn" onclick="cancelBooking('${b.id}')">Cancel</button>` 
                : 'N/A'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="color:var(--soft-rose);">Error fetching bookings.</td></tr>';
      }
    }

    async function cancelBooking(bookingId) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;

      try {
        const response = await fetch(`/api/admin/bookings/${bookingId}/cancel`, { method: 'PATCH' });
        const data = await response.json();

        if (data.success) {
          fetchBookings();
        } else {
          alert('Failed to cancel.');
        }
      } catch (err) {
        alert('Server error.');
      }
    }

    // Initialize Page Data
    loadDressDropdown();
    fetchBookings();
  </script>
</body>
</html>
